<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151a17"><meta name="description" content="SIDE LYD loop mixer."><title>SIDE LYD</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=loops-3"><script type="module" src="app.js?v=loops-3"></script>
</head>
<body>
<main class="player">
<header><h1>SIDE LYD</h1><a href="https://github.com/technicallytechnicaldesign/side-lyd" target="_blank" rel="noopener">GitHub â†—</a></header>
<section class="console" aria-label="Loop mixer">
<div class="bank-row"><label>Sound set<select id="bank" aria-label="Sound set"></select></label><div class="bank-info"><span id="tempo">â€” BPM</span><span id="assets">â€”</span></div></div>
<div class="play-row"><button id="play" class="primary" type="button" disabled>Play</button><button id="change" type="button" disabled>Change phrase</button><button id="hold" type="button" aria-pressed="false">Hold</button><div class="counter"><span id="elapsed">0:00</span><span>BAR <b id="bar">1</b> Â· PHRASE <b id="phrase">1</b></span></div></div>
<canvas id="scope" aria-label="Audio waveform"></canvas>
<div class="beat-row" aria-hidden="true"><i></i><i></i><i></i><i></i><span id="position">STOPPED</span></div>
<div class="roles">
<label><span>Drums <b id="drums-variant">A</b><output id="drums-value">80</output></span><input id="drums" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Drums level"></label>
<label><span>Bass <b id="bass-variant">A</b><output id="bass-value">80</output></span><input id="bass" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Bass level"></label>
<label><span>Music <b id="other-variant">A</b><output id="other-value">80</output></span><input id="other" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Music level"></label>
<label><span>FX<output id="fx-value">80</output></span><input id="fx" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="FX level"></label>
</div>
<div class="controls">
<label>Energy<output id="energy-value">65</output><input id="energy" type="range" min="0" max="1" value="0.65" step="0.01"></label>
<label>Variation<output id="variation-value">50</output><input id="variation" type="range" min="0" max="1" value="0.5" step="0.01"></label>
<label>Flavor<output id="flavor-value">30</output><input id="flavor" type="range" min="0" max="1" value="0.3" step="0.01"></label>
<label>Volume<output id="volume-value">70</output><input id="volume" type="range" min="0" max="1" value="0.7" step="0.01"></label>
</div>
<div class="seed-row"><label>Seed <input id="seed" type="number" min="1" max="4294967295" value="7431"></label><button id="reseed" type="button">New seed</button><button id="save-recipe" type="button">Save recipe</button></div>
<div class="record-row"><button id="record" type="button" disabled><span class="record-dot"></span> Record WAV</button><span id="record-time">0:00 / 5:00</span><button id="save-wav" type="button" disabled>Download WAV</button></div>
<p id="status" role="status" aria-live="polite">Loading sound setsâ€¦</p>
</section>
<details><summary>Recent changes</summary><ol id="history"></ol></details>
</main>
</body></html>
